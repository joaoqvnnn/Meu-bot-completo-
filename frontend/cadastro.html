<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro | Larizinha Store</title>
  <meta name="description" content="Crie sua conta gratuita na Larizinha Store e comece a comprar produtos digitais pelo Telegram." />
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0b0e14;
      --bg-card: #121722;
      --bg-card-hover: #1a2230;
      --primary: #7c5cff;
      --primary-hover: #967aff;
      --accent: #00d4aa;
      --text-primary: #f0f2f5;
      --text-secondary: #aab2c5;
      --border: #232a38;
      --radius: 12px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: var(--primary);
      transition: color 0.3s;
    }

    a:hover {
      color: var(--primary-hover);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== HEADER ===== */
    header {
      background: rgba(11, 14, 20, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      font-size: 0.95rem;
      background: transparent;
      color: var(--text-primary);
    }

    .btn-outline {
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(124, 92, 255, 0.3);
    }

    /* ===== CADASTRO SECTION ===== */
    .cadastro-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .cadastro-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow);
    }

    .cadastro-card h2 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .cadastro-subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.2);
    }

    .form-group input::placeholder {
      color: #556;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .form-check input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
    }

    .btn-cadastrar {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .btn-cadastrar:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-cadastrar:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-telegram {
      width: 100%;
      padding: 12px;
      background: #229ed9;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.3s, transform 0.2s;
    }

    .btn-telegram:hover {
      background: #1c8cc2;
      transform: translateY(-2px);
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* ===== MENSAGENS DE FEEDBACK ===== */
    .error-message {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.3);
      color: #ff6b6b;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: rgba(0, 212, 170, 0.1);
      border: 1px solid rgba(0, 212, 170, 0.3);
      color: var(--accent);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 20px 0;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    footer a {
      margin: 0 10px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .form-row {
        grid-template-columns: 1fr;
      }
      .cadastro-card {
        padding: 25px;
      }
      .navbar {
        height: 60px;
      }
      .logo {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">
        <span class="logo-icon">🛍️</span>
        Larizinha Store
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline">Entrar</a>
      </div>
    </div>
  </header>

  <!-- CADASTRO FORM -->
  <main class="cadastro-wrapper">
    <div class="cadastro-card">
      <h2>Criar conta</h2>
      <p class="cadastro-subtitle">Leva menos de 1 minuto</p>

      <!-- Mensagens de erro e sucesso -->
      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <form id="cadastroForm" autocomplete="off">
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required />
        </div>

        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" required />
          </div>
          <div class="form-group">
            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="••••••••" required />
          </div>
        </div>

        <div class="form-group">
          <label for="whatsapp">WhatsApp (opcional)</label>
          <input type="tel" id="whatsapp" name="whatsapp" placeholder="(11) 99999-9999" />
        </div>

        <div class="form-check">
          <input type="checkbox" id="termos" name="termos" required />
          <label for="termos">Li e aceito os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a></label>
        </div>

        <button type="submit" class="btn-cadastrar" id="cadastrarButton">Criar conta</button>
      </form>

      <div class="divider">ou</div>

      <button class="btn-telegram" id="telegramCadastro">
        <span>📱</span> Cadastrar com Telegram
      </button>

      <p class="login-link">
        Já tem uma conta? <a href="login.html">Faça login</a>
      </p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <p>© 2025 Larizinha Store. Todos os direitos reservados.</p>
      <p>
        <a href="#">Termos de Uso</a>
        <a href="#">Privacidade</a>
        <a href="#">Suporte</a>
      </p>
    </div>
  </footer>

  <script>
    // ===== SIMULAÇÃO DE CADASTRO (será substituído pela API real) =====
    document.getElementById('cadastroForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;
      const whatsapp = document.getElementById('whatsapp').value.trim();
      const termos = document.getElementById('termos').checked;

      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');

      // Resetar mensagens
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');

      // Validações
      if (!nome || !email || !senha || !confirmarSenha) {
        showError('Preencha todos os campos obrigatórios.');
        return;
      }

      if (senha !== confirmarSenha) {
        showError('As senhas não coincidem.');
        return;
      }

      if (!termos) {
        showError('Você precisa aceitar os termos de uso.');
        return;
      }

      // Em produção, aqui seria feita a chamada à API:
      // fetch('/api/auth/register', { method: 'POST', ... })
      //   .then(response => response.json())
      //   .then(data => { ... })

      // Simulação de sucesso
      showSuccess('Conta criada com sucesso! Redirecionando para o login...');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    });

    // Cadastro via Telegram (placeholder)
    document.getElementById('telegramCadastro').addEventListener('click', function () {
      alert('O cadastro via Telegram será integrado em breve. Use o bot para vincular sua conta.');
    });

    function showError(message) {
      const errorElement = document.getElementById('errorMessage');
      errorElement.textContent = message;
      errorElement.classList.add('show');
    }

    function showSuccess(message) {
      const successElement = document.getElementById('successMessage');
      successElement.textContent = message;
      successElement.classList.add('show');
    }
  </script>

</body>
</html>
