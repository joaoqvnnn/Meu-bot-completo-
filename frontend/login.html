<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Larizinha Store</title>
  <meta name="description" content="Acesse sua conta na Larizinha Store para gerenciar produtos, saldo e afiliados." />
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0b0e14;
      --bg-card: #121722;
      --bg-card-hover: #1a2230;
      --primary: #7c5cff;
      --primary-hover: #967aff;
      --accent: #00d4aa;
      --text-primary: #f0f2f5;
      --text-secondary: #aab2c5;
      --border: #232a38;
      --radius: 12px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: var(--primary);
      transition: color 0.3s;
    }

    a:hover {
      color: var(--primary-hover);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== HEADER ===== */
    header {
      background: rgba(11, 14, 20, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      font-size: 0.95rem;
      background: transparent;
      color: var(--text-primary);
    }

    .btn-outline {
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(124, 92, 255, 0.3);
    }

    /* ===== LOGIN SECTION ===== */
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .login-subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.2);
    }

    .form-group input::placeholder {
      color: #556;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .form-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .form-options input[type="checkbox"] {
      accent-color: var(--primary);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .btn-login:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-telegram {
      width: 100%;
      padding: 12px;
      background: #229ed9;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.3s, transform 0.2s;
    }

    .btn-telegram:hover {
      background: #1c8cc2;
      transform: translateY(-2px);
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    /* ===== ERROR MESSAGE ===== */
    .error-message {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.3);
      color: #ff6b6b;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 20px 0;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    footer a {
      margin: 0 10px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .login-card {
        padding: 25px;
      }
      .navbar {
        height: 60px;
      }
      .logo {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">
        <span class="logo-icon">🛍️</span>
        Larizinha Store
      </a>
      <div class="nav-actions">
        <a href="cadastro.html" class="btn btn-outline">Criar conta</a>
      </div>
    </div>
  </header>

  <!-- LOGIN FORM -->
  <main class="login-wrapper">
    <div class="login-card">
      <h2>Entrar</h2>
      <p class="login-subtitle">Acesse seu painel de controle</p>

      <!-- Mensagem de erro (exibida via JS) -->
      <div id="errorMessage" class="error-message"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="email">E-mail ou nome de usuário</label>
          <input type="text" id="email" name="email" placeholder="voce@exemplo.com" required />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>

        <div class="form-options">
          <label>
            <input type="checkbox" id="remember" name="remember" />
            Lembrar de mim
          </label>
          <a href="recuperar-senha.html">Esqueci minha senha</a>
        </div>

        <button type="submit" class="btn-login" id="loginButton">Entrar</button>
      </form>

      <div class="divider">ou</div>

      <button class="btn-telegram" id="telegramLogin">
        <span>📱</span> Entrar com Telegram
      </button>

      <p class="register-link">
        Não tem uma conta? <a href="cadastro.html">Cadastre-se gratuitamente</a>
      </p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <p>© 2025 Larizinha Store. Todos os direitos reservados.</p>
      <p>
        <a href="#">Termos de Uso</a>
        <a href="#">Privacidade</a>
        <a href="#">Suporte</a>
      </p>
    </div>
  </footer>

  <script>
    // ===== SIMULAÇÃO DE AUTENTICAÇÃO (será substituído pela API real) =====
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');

      // Validação simples
      if (!email || !password) {
        showError('Preencha todos os campos.');
        return;
      }

      // Em produção, esta parte será substituída por uma chamada à API real:
      // fetch('/api/auth/login', { method: 'POST', ... })
      //   .then(response => response.json())
      //   .then(data => { ... })

      // Simulação de login bem-sucedido (usuário demo)
      if (email === 'admin@larizinha.com' && password === '123456') {
        showError('');
        // Redireciona para o dashboard
        window.location.href = 'admin/dashboard.html';
      } else {
        showError('Credenciais inválidas. Tente admin@larizinha.com / 123456 (demo).');
      }
    });

    // Login via Telegram (placeholder)
    document.getElementById('telegramLogin').addEventListener('click', function () {
      // Em produção, deve-se implementar OAuth do Telegram ou vinculação via bot.
      alert('Login via Telegram será integrado em breve. Use o bot para vincular sua conta.');
    });

    function showError(message) {
      const errorElement = document.getElementById('errorMessage');
      if (message) {
        errorElement.textContent = message;
        errorElement.classList.add('show');
      } else {
        errorElement.classList.remove('show');
      }
    }
  </script>

</body>
</html>
